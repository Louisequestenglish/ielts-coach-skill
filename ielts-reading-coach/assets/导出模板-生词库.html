<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的阅读生词库</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf6ef; color: #333; margin: 0; padding: 24px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .brand { position: relative; background: #fff; border-radius: 12px; padding: 20px 22px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 12px; border-bottom: 4px solid #2F4B7C; overflow: hidden; }
  .brand .logo { position: absolute; top: 14px; right: 16px; height: 30px; }
  .brand h1 { font-size: 22px; color: #2F4B7C; margin: 0 0 4px; }
  .brand .sub { font-size: 13px; color: #999; margin: 0; }
  .brand .dot { position: absolute; bottom: 13px; right: 46px; width: 12px; height: 12px; border-radius: 50%; background: #D84830; }
  .brand .sq { position: absolute; bottom: 13px; right: 22px; width: 14px; height: 14px; background: #2F4B7C; transform: rotate(45deg); }
  .viewswitch, .stateswitch { background: #fff; border-radius: 12px; padding: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 10px; display: flex; gap: 6px; }
  .viewswitch button, .stateswitch button { flex: 1; border: none; padding: 10px 0; border-radius: 8px; font-size: 14.5px; font-weight: 600; cursor: pointer; background: #EDF1F8; color: #2F4B7C; transition: background .15s; }
  .viewswitch button.active { background: #2F4B7C; color: #fff; }
  .viewswitch button.active.en { background: #D84830; }
  .guide { background: #EDF1F8; border-left: 4px solid #2F4B7C; color: #2F4B7C; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; margin-bottom: 10px; line-height: 1.6; }
  .guide.en { background: #fdefe8; border-left-color: #D84830; color: #D84830; }
  .stateswitch button.active.todo { background: #D84830; color: #fff; }
  .stateswitch button.active.done { background: #3a9d6e; color: #fff; }
  .stateswitch button.active.all { background: #2F4B7C; color: #fff; }
  .toolbar { background: #fff; border-radius: 12px; padding: 10px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar label { font-size: 12px; color: #999; }
  .toolbar select { border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; font-size: 13px; color: #2F4B7C; background: #fff; outline: none; }
  .toolbar .count { margin-left: auto; font-size: 12px; color: #999; }
  .sec { background: #2F4B7C; color: #fff; border-radius: 10px; padding: 8px 14px; margin: 20px 0 10px; font-size: 14px; font-weight: 600; }
  .card { background: #fff; border-radius: 12px; padding: 8px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 16px; }
  .word { padding: 11px 0; border-bottom: 1px dashed #eee; }
  .word:last-child { border-bottom: none; }
  .word .top { display: flex; align-items: center; gap: 8px; }
  .word input[type=checkbox] { width: 17px; height: 17px; accent-color: #3a9d6e; flex: none; cursor: pointer; }
  .word .w { font-size: 15px; font-weight: 700; color: #222; }
  .word .zh { font-size: 13px; color: #666; margin: 3px 0 3px 25px; }
  .word .en { font-size: 12.5px; color: #999; line-height: 1.6; margin-left: 25px; }
  .word .meta { font-size: 11px; color: #bbb; margin: 4px 0 0 25px; }
  .word .meta .cat { color: #2F4B7C; }
  .word.done .w, .word.done .en { color: #3d66b8; }
  .word.done .zh { color: #6a8fd0; }
  .empty { text-align: center; color: #bbb; font-size: 13px; padding: 40px 0; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .pool { font-size: 12px; color: #999; margin: 4px 0 0; }
  .footer { text-align: center; font-size: 12px; color: #bbb; margin-top: 30px; }
</style>
</head>

    <h1>我的阅读生词库</h1>
    <div class="sub">旷野英语 · 雅思核心课 ｜ 雅思阅读精读教练</div>
    <div class="dot"></div><div class="sq"></div>
  </div>

  <div class="viewswitch">
    <button id="v-full" class="active">👁 英中对照</button>
    <button id="v-en" class="en">🔤 只看英文</button>
  </div>

  <div class="guide" id="guide"></div>

  <div class="stateswitch">
    <button id="s-todo" class="active todo">🔥 还不熟</button>
    <button id="s-done" class="done">✅ 我已掌握</button>
    <button id="s-all" class="all">📚 全部</button>
  </div>

  <div class="toolbar">
    <label>类别</label>
    <select id="f-cat">
      <option value="all">全部</option>
      <option>教育</option><option>科技</option><option>环境</option><option>健康</option><option>社会</option><option>历史</option><option>动植物</option><option>商业</option><option>文化</option><option>其他</option>
    </select>
    <label>时间</label>
    <select id="f-time">
      <option value="all">全部</option>
      <option value="7">最近 7 天</option>
      <option value="30">最近 30 天</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <p class="pool">挑勾只在「🔤 只看英文」里开放——单词孤零零摆着，认得出才算掌握。勾上 = 进「我已掌握」；去掉勾 = 回「还不熟」。刚整理进来的词默认都在「还不熟」里。<br>勾会记在这台电脑的这个浏览器里（关掉再打开还在）；换浏览器、换设备或清掉浏览器记录就没了。想让教练那边的生词库也同步更新，说一声。</p>

  <div class="footer"><a href="我的阅读库.html">← 我的阅读库</a><br>由雅思精读教练生成 ｜ 双击本文件即可离线查看</div>
</div>

<script>
  // ═══ 生成说明（教练生成时按生词库.md 填写，生成完保留本注释亦可）═══
  // NOW 不用填——打开页面的当天自动算，时间筛选按打开当天倒推。
  // DATA：生词库.md 每条一行填一个对象：
  //   w = 生词文本（不加粗符号）；zh = 意思提醒；en = 原句（生词处用 <b></b> 标出）；
  //   cat = 该节类别；date = 该节日期（YYYY-MM-DD）；done = ☐ → false，✅ → true。
  const NOW = new Date();
  const DATA = [
    // { w: 'play no part in', zh: '不参与、不起作用', en: 'The schools <b>play no part in</b> the decision.', cat: '环境', date: '2026-11-05', done: false },
  ];
  // 本地记忆：勾选状态存浏览器 localStorage（key 带前缀，避免跟其他本地文件串）。
  // 页面上的勾先读这里（覆盖 DATA 里的 done），勾了就写这里；教练重新导出覆盖本文件时
  // localStorage 还在（按 file:// origin 记），所以 MD 的 ☐/✅ 是正主、页面勾选是自测暂存。
  let localCheck = {};
  try { localCheck = JSON.parse(localStorage.getItem('ysyk-check') || '{}'); } catch (e) { localCheck = {}; }
  DATA.forEach(item => { if (item.w in localCheck) item.done = localCheck[item.w]; });
  let VIEW = 'full';
  let STATE = 'todo';

  function daysAgo(d){ return Math.floor((NOW - new Date(d + 'T00:00:00')) / 86400000); }
  function passFilter(item){
    const cat = document.getElementById('f-cat').value, t = document.getElementById('f-time').value;
    if (cat !== 'all' && item.cat !== cat) return false;
    if (t !== 'all' && daysAgo(item.date) > +t) return false;
    if (STATE === 'todo' && item.done) return false;
    if (STATE === 'done' && !item.done) return false;
    return true;
  }
  function wordEl(item){
    const el = document.createElement('div');
    el.className = 'word' + (item.done ? ' done' : '');
    const tick = (VIEW === 'en')
      ? '<input type="checkbox"' + (item.done ? ' checked' : '') + '>'
      : '';
    el.innerHTML =
      '<div class="top">' + tick + '<span class="w">' + item.w + '</span></div>' +
      '<div class="zh">' + item.zh + '</div>' +
      '<div class="en">' + item.en + '</div>' +
      '<div class="meta"><span class="cat">' + item.cat + '</span> · ' + item.date + '</div>';
    el.querySelector('.zh').style.display = (VIEW === 'en') ? 'none' : '';
    el.querySelector('.en').style.display = (VIEW === 'en') ? 'none' : '';
    el.querySelector('.meta').style.display = (VIEW === 'en') ? 'none' : '';
    if (VIEW === 'en') el.querySelector('input').addEventListener('change', e => {
      item.done = e.target.checked;
      localCheck[item.w] = e.target.checked;
      try { localStorage.setItem('ysyk-check', JSON.stringify(localCheck)); } catch (err) {}
      render();
    });
    return el;
  }
  function render(){
    const box = document.getElementById('list');
    box.innerHTML = '';
    const groups = {};
    DATA.forEach(item => {
      if (!passFilter(item)) return;
      const key = item.cat + '|' + item.date;
      (groups[key] = groups[key] || []).push(item);
    });
    let total = 0;
    Object.entries(groups).forEach(([key, items]) => {
      const card = document.createElement('div'); card.className = 'card';
      items.forEach(item => card.appendChild(wordEl(item)));
      if (VIEW !== 'en') {
        const [cat, date] = key.split('|');
        const sec = document.createElement('div'); sec.className = 'sec';
        sec.textContent = '📚 ' + cat + ' · ' + date + ' ｜ ' + items.length + ' 条';
        box.appendChild(sec);
      }
      box.appendChild(card);
      total += items.length;
    });
    if (!total) {
      const tip = STATE === 'todo' ? '还不熟的都掌握啦 🎉' : (STATE === 'done' ? '还没有勾过的词' : '这个条件下一句都没有');
      box.innerHTML = '<div class="empty">' + tip + '</div>';
    }
    document.getElementById('count').textContent = '显示 ' + total + ' 条';
  }
  function updateGuide(){
    const g = document.getElementById('guide');
    if (VIEW === 'en') {
      g.className = 'guide en';
      g.innerHTML = '✍️ 现在只看单词本身——中文和例句都藏起来了：<br>认得出的 → 勾上 ✅，进「我已掌握」；认不出的 → 别勾，留在「还不熟」继续背。';
    } else {
      g.className = 'guide';
      g.innerHTML = '🔒 英中对照时不能挑勾——要检验自己到底认不认得，切到「🔤 只看英文」：<br>不看中文认得出，才算真的掌握。';
    }
  }
  document.getElementById('v-full').addEventListener('click', () => { VIEW = 'full'; document.getElementById('v-full').classList.add('active'); document.getElementById('v-en').classList.remove('active'); updateGuide(); render(); });
  document.getElementById('v-en').addEventListener('click', () => { VIEW = 'en'; document.getElementById('v-en').classList.add('active'); document.getElementById('v-full').classList.remove('active'); updateGuide(); render(); });
  document.getElementById('s-todo').addEventListener('click', () => { STATE = 'todo'; syncState(); render(); });
  document.getElementById('s-done').addEventListener('click', () => { STATE = 'done'; syncState(); render(); });
  document.getElementById('s-all').addEventListener('click', () => { STATE = 'all'; syncState(); render(); });
  function syncState(){
    document.getElementById('s-todo').classList.toggle('active', STATE === 'todo');
    document.getElementById('s-done').classList.toggle('active', STATE === 'done');
    document.getElementById('s-all').classList.toggle('active', STATE === 'all');
  }
  ['f-cat','f-time'].forEach(id => document.getElementById(id).addEventListener('change', render));
  updateGuide();
  render();
</script>
</body>
</html>
