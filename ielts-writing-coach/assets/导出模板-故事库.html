       生成规则（教练照填，示例数据替换成真实档案；没有的区段把数组清空，对应小节自动不显示）：
       读「生活故事」子文件夹的故事库目录.txt 拿故事清单（顺序照目录），每个故事读它的故事卡.md：
       STORIES 每个故事 = { name:故事名, tag:话题标签（故事卡标题下一行的「> 话题：X」里的 X；旧故事没标签 → 留空，自动归「未分类」）,

         beats:[ { en:英文正文（好表达加粗 <b>）, zh:中文对照, kw:内容关键词, hi:亮点表达, audio:该 beat 的 mp3 base64（音频文件夹里有就内嵌，没有 → 留空）}, … ],
         full:全.mp3 的 base64（有整篇连读就填，没有 → 留空） }
       XUANTI 读 串题档案.md：新格式每个「故事串」节一张卡 { head:'故事串N · 故事名', rows:[ { d:日期, q:所串题目, s:开头要点, from:故事名, beats:[ {en:英文正文, zh:中文对照}, … ] }, … ] }；
         每行先把方案里「取 Beat X」提到的 beat 从对应故事卡.md 把全文抄进来（beats 填正文、from 填故事名、s 只留开头要点部分）——学生不用自己翻故事区；
         库里没有对应故事卡/beat（比如学生直接练串题、没建故事库）→ beats 留空、from 留空、s 写完整方案行，页面照旧只显示方案。
         旧格式（日期｜所串题目）照旧出卡（接旧不搬）：{ head:'日期', rows:[ { q:所串题目, s:'复用故事：X' } ] }，能解析出 beat 就同样把正文带出来。
       EXPR 读 精华表达.md：一行一条（行首 ☐/✅ 是练熟标记，解析时跳过、只取表达本身）{ e:表达, z:中文意思, from:来自哪个故事, n:重复次数（重复出现标「又用了 N 次」，n>1 才出 chip）, d:记录日期（重复出现更新为最近一次；旧条目没有 → 留空） }。
       本页精华节=纯清单；**练熟勾选自测在口语练习档案页第六块（口语+故事合并），勾选回流 精华表达.md 由 导出模板-口语.html 的【生成规则·勾选回流】做**。
       本页 STATE 行只带 folds：读旧「我的故事库.html」STATE 行的 folds 沿用（读不到 → 给 {}），插在 const NOW = new Date(); 之后：
          `/*STAT` + `E*/window.__SAVED__ = {"checks":{},"folds":{…}};

       时间筛选（纯练故事）=全部/近 7 天/近 1 个月/更久之前，按打开页面的当天倒推，不用填「今天」。
       注意：英文正文常带撇号（couldn't），会打断单引号字符串——含撇号的字段改用双引号包住。 -->

<script>
  // —— 三节折叠（节头点击收起/展开，状态存本地，下次打开记住）——
  function bindFold(head, wrap, key) {
    let open = true;
    try {
      if (localStorage.getItem(key) === '0') open = false;
      else if (localStorage.getItem(key) === null && typeof window !== 'undefined' && window.__SAVED__ && window.__SAVED__.folds && key in window.__SAVED__.folds) open = window.__SAVED__.folds[key] !== '0';
    } catch (e) {}
    const arrow = head.querySelector('.fold-arrow');
    function apply() {
      wrap.style.display = open ? '' : 'none';
      if (arrow) arrow.textContent = open ? '▾' : '▸';
    }
    head.onclick = function (e) {
      if (e && e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      open = !open;
      try { localStorage.setItem(key, open ? '1' : '0'); } catch (e) {}
      apply();
      if (typeof autoSave === 'function') autoSave();
    };
    apply();
  }

  // —— 通用：打开当天 + 时间档（全部/近 7 天/近 1 个月/更久之前）——
  const NOW = new Date();
  const NR = '<div class="nr">🔊 这段英文可直接放进 <a href="https://www.naturalreader.com/online/" target="_blank">NaturalReader</a> 模仿跟读</div>';
  const NR2 = '<div class="nr">🔊 练这题的跟读模仿：把要练的英文放进 <a href="https://www.naturalreader.com/online/" target="_blank">NaturalReader</a> 就能听、跟着读</div>';
  function daysAgo(d) { if (!d) return Infinity; return Math.floor((NOW - new Date(d + 'T00:00:00')) / 86400000); }
  function passTime(d, t) {
    if (t === 'all') return true;
    if (t === 'old') return daysAgo(d) > 30;
    return daysAgo(d) <= +t;
  }

  // —— 🎤 纯练故事：话题 + 时间筛选 ——
  const storyBox = document.getElementById('stories');
  const sel = document.getElementById('f-topic');
  const sTime = document.getElementById('f-stime');
  const cnt = document.getElementById('story-cnt');
  function audioStatus(s) {
    const n = s.beats.filter(b => b.audio).length;
    if (!n) return '暂无音频';
    return s.full ? n + ' 段 + 整篇' : n + ' 段音频';
  }
  function renderStories() {
    const tag = sel.value, t = sTime.value;
    const shown = STORIES.filter(s => (tag === 'uncat' ? !s.tag : (tag === 'all' ? true : s.tag === tag)) && passTime(s.d, t));
    cnt.textContent = '共 ' + shown.length + ' 个故事';
    storyBox.innerHTML = shown.map(s => {
      let beatsHtml = s.beats.map((b, i) =>
        '<div class="beat"><h3>Beat ' + (i + 1) + '</h3>' +
        '<p class="en">' + b.en + '</p><p class="zh">' + b.zh + '</p>' +
        '<p class="kw">🔑 内容关键词：' + b.kw + '</p><p class="hi">✨ 亮点表达：' + b.hi + '</p>' +
        (b.audio ? '<audio controls src="' + b.audio + '"></audio>' : NR) + '</div>'
      ).join('');
      if (s.full) beatsHtml += '<div class="beat"><h3>整篇连读</h3><audio controls src="' + s.full + '"></audio></div>';
      return '<div class="card"><div class="shead">🎤 ' + s.name +
        (s.tag ? '<span class="chip tag">' + s.tag + '</span>' : '') +
        '<span class="chip">' + s.beats.length + ' 个 beat</span><span class="chip b">' + audioStatus(s) + '</span></div>' +
        beatsHtml + '</div>';
    }).join('');
    if (!shown.length) storyBox.innerHTML = '<div class="empty">没有符合条件的故事</div>';
  }
  if (STORIES.length) {
    const topics = [...new Set(STORIES.map(s => s.tag).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
    const hasUncat = STORIES.some(s => !s.tag);
    let opts = '<option value="all">全部话题</option>' + topics.map(t => '<option value="' + t + '">' + t + '</option>').join('');
    if (hasUncat) opts += '<option value="uncat">未分类</option>';
    sel.innerHTML = opts;
    sTime.innerHTML = '<option value="all">全部</option><option value="7">近 7 天</option><option value="30">近 1 个月</option><option value="old">更久之前</option>';
    sel.onchange = renderStories;
    sTime.onchange = renderStories;
    renderStories();
  } else {
    document.querySelector('.toolbar').style.display = 'none';
    storyBox.innerHTML = '<div class="empty">还没有故事——想讲你的故事，说「我的故事」就行。</div>';
  }
  bindFold(document.getElementById('head-stories'), document.getElementById('stories-wrap'), 'ysgk-fold-stories');

  // —— 🧵 串题：故事串卡 + 搜 P2 题；解析出 beat 的行把全文摆出来 ——
  const xBox = document.getElementById('xuantis');
  const xEmpty = document.getElementById('x-empty');
  function renderXuantis() {
    xBox.innerHTML = XUANTI.map(c =>
      '<div class="card"><div class="xhead">' + c.head + '</div>' +
      c.rows.map(r => {
        let body;
        if (r.beats && r.beats.length) {
          body = '<div class="xrun">' +
            (r.from ? '<p class="xbased">基于你练过的《' + r.from + '》</p>' : '') +
            (r.s ? '<p class="xopen">开头：' + r.s + '</p>' : '') +
            r.beats.map(b => '<div class="xbeat"><p class="en">' + b.en + '</p>' + (b.zh ? '<p class="zh">' + b.zh + '</p>' : '') + '</div>').join('') +
            NR +
            '</div>';
        } else {
          body = '<p class="hi">' + (r.d ? '→ ' : '') + r.s + '</p>' + NR2;
        }
        return '<div class="xrow"><p class="kw">' + (r.d ? r.d + '｜' : '') + r.q + '</p>' + body + '</div>';
      }).join('') + '</div>'
    ).join('');
  }
  if (XUANTI.length) {
    renderXuantis();
    const chuan = document.getElementById('f-chuan');
    chuan.innerHTML = '<option value="all">全部故事串</option>' +
      XUANTI.map((c, i) => '<option value="' + i + '">' + c.head + '</option>').join('');
    document.getElementById('x-chuan-cnt').textContent = '共 ' + XUANTI.length + ' 个故事串';
    const input = document.getElementById('f-search');
    function applyXuanti() {
      const q = input.value.trim().toLowerCase();
      const sel = chuan.value;
      const cards = xBox.querySelectorAll('.card');
      let any = false;
      cards.forEach((card, i) => {
        const cardOn = sel === 'all' || sel === String(i);
        let shown = 0;
        card.querySelectorAll('.xrow').forEach(row => {
          const hit = cardOn && (!q || row.querySelector('.kw').textContent.toLowerCase().includes(q));
          row.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        card.style.display = shown ? '' : 'none';
        if (shown) any = true;
      });
      xEmpty.style.display = any ? 'none' : '';
    }
    input.oninput = applyXuanti;
    chuan.onchange = applyXuanti;
    bindFold(document.getElementById('head-xuanti'), document.getElementById('xuantis-wrap'), 'ysgk-fold-xuanti');
  } else {
    document.getElementById('head-xuanti').style.display = 'none';
    document.getElementById('xuantis-wrap').style.display = 'none';
  }

  // —— ⭐ 精华表达：纯清单（练熟勾选的自测在口语练习档案页第六块，口语+故事合并）——
  const exprBox = document.getElementById('exprs');
  if (EXPR.length) {
    exprBox.innerHTML = '<div class="card">' + EXPR.map(e =>
      '<div class="expr"><div class="exbody"><b>' + e.e + '</b> —— ' + e.z +
      '<span class="chip">' + e.from + '</span>' +
      (e.n > 1 ? '<span class="chip b">又用了 ' + e.n + ' 次</span>' : '') +
      (e.d ? '<span class="exdate">' + e.d + '</span>' : '') +
      '</div></div>'
    ).join('') + '</div>';
    bindFold(document.getElementById('head-expr'), document.getElementById('exprs-wrap'), 'ysgk-fold-expr');
  } else {
    document.getElementById('head-expr').style.display = 'none';
    document.getElementById('exprs-wrap').style.display = 'none';
  }

  // 💾 保存：把勾选/折叠状态写进这个 HTML 文件本身（清浏览器记录、换电脑都不丢）
  function collectState() {
    const s = { checks: {}, folds: {} };
    try { ['ysgk-fold-stories', 'ysgk-fold-xuanti', 'ysgk-fold-expr'].forEach(k => { const v = localStorage.getItem(k); if (v !== null) s.folds[k] = v; }); } catch (e) {}
    return s;
  }
  // —— 自动保存：第一次点「保存」弹一次框（直接开在桌面，点「选择」就行，不用进文件夹，
  //    代码沿规定好的路径自己找文件），之后勾选/折叠变化自动静默写进那个文件，不用再点 ——
  function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('ysjk-t', 1); r.onupgradeneeded = () => { try { r.result.createObjectStore('h'); } catch (e) {} }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  // IDB 坏了/卡死时绝不拖垮保存：全部 1.5s 超时兜底（超时=当没记忆，走弹框；picker id 记忆是第二通道）
  const idbT = (p, ms) => new Promise((res) => { const t = setTimeout(() => res(null), ms); p.then(v => { clearTimeout(t); res(v); }, () => { clearTimeout(t); res(null); }); });
  async function getSavedDir() { try { const db = await idbT(idbOpen(), 1500); if (!db) return null; return await idbT(new Promise((res, rej) => { const g = db.transaction('h', 'readonly').objectStore('h').get('d'); g.onsuccess = () => res(g.result || null); g.onerror = () => rej(g.error); }), 1500); } catch (e) { return null; } }
  async function putSavedDir(d) { try { const db = await idbT(idbOpen(), 1500); if (!db) return; await idbT(new Promise((res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(d, 'd'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }), 1500); } catch (e) {} }
  async function delSavedDir() { try { const db = await idbT(idbOpen(), 1000); if (!db) return; await idbT(new Promise((res, rej) => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').delete('d'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }), 1000); } catch (e) {} }
  function pickFailN() { try { return parseInt(localStorage.getItem('ysgk-pickfail') || '0', 10) || 0; } catch (e) { return 0; } }
  function bumpPickFail() { try { localStorage.setItem('ysgk-pickfail', String(pickFailN() + 1)); } catch (e) {} }
  function clearPickFail() { try { localStorage.removeItem('ysgk-pickfail'); } catch (e) {} }
  function pickerId() { const n = pickFailN(); return 'ysjk-dir' + (n ? '-' + (n % 5) : ''); }
  async function writeHandle(h, html, name) { const w = await h.createWritable(); await w.write(new File([html], name, { type: 'text/html' })); await w.close(); }
  const SUB = '生活故事'; // 档案规定放在「雅思教练」文件夹的这个子文件夹里
  async function resolveFileHandle(dir, sub, name) {
    // 从指认的文件夹出发，沿规定好的路径找同名文件：直接同名 → 子文件夹/同名 → 雅思教练/子文件夹/同名 → 页面自己所在路径往上几层
    const cands = [name, sub + '/' + name, '雅思教练/' + sub + '/' + name];
    try {
      const segs = decodeURIComponent(location.pathname).split('/').filter(Boolean);
      const i = segs.indexOf(name);
      for (let k = 1; k <= 4; k++) { if (i - k >= 0) cands.push(segs.slice(i - k, i + 1).join('/')); }
    } catch (e) {}
    const seen = new Set();
    for (const rel of cands) {
      if (seen.has(rel)) continue; seen.add(rel);
      try {
        const parts = rel.split('/').filter(Boolean);
        let h = dir;
        for (let p = 0; p < parts.length - 1; p++) h = await h.getDirectoryHandle(parts[p], { create: false });
        return await h.getFileHandle(parts[parts.length - 1], { create: false });
      } catch (e) {
        if (e && e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') throw e;
      }
    }
    return null;
  }
  const pageLoadedAt = Date.now();
  let lastWriteAt = 0;
  async function saveState(auto) {
    const hint = document.getElementById('savehint');
    const set = (t, ok) => { hint.textContent = t; hint.style.color = ok ? '#2E7D54' : '#c0392b'; };
    const canFs = typeof indexedDB !== 'undefined' && !!window.showDirectoryPicker;
    let dir = null;
    if (canFs) {
      // 快速通道：IDB 记忆 350ms 内答不上来就放弃（卡死的 IDB 不拖慢保存）；
      // 弹框的 picker id 记忆本身就能免弹，IDB 只是第二保险
      const dirP = getSavedDir();
      dir = await idbT(dirP, auto ? 1500 : 350);
      if (dir) {
        try { if (await dir.queryPermission({ mode: 'readwrite' }) !== 'granted') dir = null; } catch (e) { dir = null; }
      }
    }
    if (auto && !dir) {
      set('勾选已记在浏览器里——点一下「💾 保存状态进文件」、弹框直接点「选择」，以后勾了就自动写进文件', false);
      return;
    }
    let first = false;
    if (canFs && !dir) {
      first = true;
      try {
        dir = await window.showDirectoryPicker({ id: pickerId(), mode: 'readwrite', startIn: 'desktop' });
      } catch (e) {
        if (e && e.name === 'AbortError') { set('', true); return; }
        throw e;
      }
    }
    try {
      const state = collectState();
      const M = '/*STAT' + 'E*/window.__SAVED__';
      let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const line = M + ' = ' + JSON.stringify(state).replace(/<\//g, '<\\/') + ';\n';
      if (html.indexOf(M) >= 0) html = html.replace(/\/\*STATE\*\/window\.__SAVED__ = [^\n]*\n/, () => line);
      else html = html.replace(/const NOW = new Date\(\);(\r?\n)/, 'const NOW = new Date();$1' + line);
      const name = decodeURIComponent((location.pathname.split('/').pop()) || '我的故事库.html');
      if (canFs) {
        try {
          let h = await resolveFileHandle(dir, SUB, name);
          if (!h) {
            // 文件夹里没找到这个文件：清掉记忆、换新 id 立刻重弹一次框（id 记忆静默返回错文件夹时保证弹框一定出现）
            delSavedDir(); bumpPickFail();
            try { dir = await window.showDirectoryPicker({ id: pickerId(), mode: 'readwrite', startIn: 'desktop' }); }
            catch (e) { if (e && e.name === 'AbortError') { set('', true); return; } throw e; }
            first = true;
            h = await resolveFileHandle(dir, SUB, name);
          }
          if (!h) { bumpPickFail(); set('⚠️ 没找到「' + name + '」——再点一次保存，弹框会再出现：点一下「雅思教练」文件夹（文件就在它里面的子文件夹里），再点「选择」', false); return; }
          const f = await h.getFile();
          if (f.lastModified > (lastWriteAt || pageLoadedAt) + 500) {
            set('⚠️ 这个文件刚才在别处更新过（比如教练重新生成）——重新打开文件再继续，别盖掉新内容', false);
            return;
          }
          await writeHandle(h, html, name);
          await putSavedDir(dir); clearPickFail();
          lastWriteAt = Date.now();
          set(first ? '✅ 已保存——记住这个文件夹了，以后勾选/折叠自动写进这个文件，不用再点' : (auto ? '✅ 已自动写进文件' : '✅ 已保存——写进这个文件夹里的文件了'), true);
          return;
        } catch (e) {
          if (e && e.name === 'NotFoundError') { set('⚠️ 没找到「' + name + '」——再点一次保存，在弹框里进到档案在的那个文件夹再点「选择」', false); return; }
          throw e;
        }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      set('✅ 已生成新文件——用它替换原来的文件就行', true);
    } catch (e) {
      if (e && e.name === 'AbortError') { set('', true); return; }
      set('⚠️ 没存上：' + (e && e.message ? e.message : e), false);
    }
  }
  // 勾选/折叠变化 → 防抖后自动写（正在写时排队，避免并发）
  let saveTimer = null, saving = false, saveAgain = false;
  function autoSave() {
    if (typeof indexedDB === 'undefined' || !window.showDirectoryPicker) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(runSave, 400);
  }
  async function runSave() {
    if (saving) { saveAgain = true; return; }
    saving = true;
    try { await saveState(true); } catch (e) {}
    saving = false;
    if (saveAgain) { saveAgain = false; runSave(); }
  }
  const saveBtn = document.getElementById('btn-save');
  if (saveBtn) saveBtn.addEventListener('click', () => saveState(false));
</script>
</body>
</html>
