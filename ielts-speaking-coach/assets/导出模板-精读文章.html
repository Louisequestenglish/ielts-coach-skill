<meta charset="UTF-8">

<title>我精读过的文章库</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf6ef; color: #333; margin: 0; padding: 24px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .brand { position: relative; background: #fff; border-radius: 12px; padding: 20px 22px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 12px; border-bottom: 4px solid #2F4B7C; overflow: hidden; }
  .brand .logo { position: absolute; top: 14px; right: 16px; height: 30px; }
  .brand h1 { font-size: 22px; color: #2F4B7C; margin: 0 0 4px; }
  .brand .sub { font-size: 13px; color: #6f6f6f; margin: 0; }
  .brand .dot { position: absolute; bottom: 13px; right: 46px; width: 12px; height: 12px; border-radius: 50%; background: #D84830; }
  .brand .sq { position: absolute; bottom: 13px; right: 22px; width: 14px; height: 14px; background: #2F4B7C; transform: rotate(45deg); }
  .hint { background: #EDF1F8; border-left: 4px solid #2F4B7C; color: #2F4B7C; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; margin-bottom: 10px; line-height: 1.6; }
  .toolbar { background: #fff; border-radius: 12px; padding: 10px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar label { font-size: 12px; color: #6f6f6f; }
  .toolbar select { border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; font-size: 13px; color: #2F4B7C; background: #fff; outline: none; }
  .toolbar .count { margin-left: auto; font-size: 12px; color: #6f6f6f; }
  .sec { background: #2F4B7C; color: #fff; border-radius: 10px; padding: 8px 14px; margin: 22px 0 10px; font-size: 14px; font-weight: 600; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 12px; }
  .card > summary.title { list-style: none; cursor: pointer; padding: 14px 22px; font-size: 15.5px; color: #2F4B7C; font-weight: 600; outline: none; display: flex; align-items: center; }
  .card > summary.title::-webkit-details-marker { display: none; }
  .card > summary.title::before { content: '▸ '; color: #C0392B; margin-right: 6px; }
  .card[open] > summary.title::before { content: '▾ '; }
  .card > summary.title:hover { color: #C0392B; }
  .card .date { margin-left: auto; font-size: 12px; color: #6f6f6f; font-weight: 400; }
  .card .body { padding: 2px 22px 16px; }
  .card .body p { font-size: 14.5px; line-height: 1.9; color: #333; margin: 12px 0 0; }
  .card .body details { border-top: 1px dashed #eee; margin-top: 12px; padding-top: 8px; }
  .card .body summary { cursor: pointer; color: #2F4B7C; font-size: 13px; font-weight: 600; outline: none; list-style: none; }
  .card .body summary::-webkit-details-marker { display: none; }
  .card .body summary:hover { color: #C0392B; }
  .tr { background: #f4f1ea; border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
  .tr p { font-size: 13.5px; line-height: 1.9; color: #666; margin: 0 0 8px; }
  .tr p:last-child { margin-bottom: 0; }
  .empty { text-align: center; color: #6f6f6f; font-size: 13px; padding: 40px 0; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .footer { text-align: center; font-size: 12px; color: #6f6f6f; margin-top: 30px; line-height: 2; }
  .footer a { color: #2F4B7C; text-decoration: none; font-weight: 600; }
  .footer a:hover { color: #C0392B; }
</style>
</head>

    <h1>我精读过的文章库</h1>
    <div class="sub">旷野英语 · 雅思核心课 ｜ 雅思阅读精读教练</div>
    <div class="dot"></div><div class="sq"></div>
  </div>

  <div class="hint">精读过的文章都存这。想泛读哪篇，点开篇名直接读——不抠句子，顺一遍意思，读得比上次顺，这篇就算吃透了。卡住就展开「中文意思参考」自查。</div>

  <div class="toolbar">
    <label>话题</label>
    <select id="f-cat">
      <option value="all">全部</option>
      <option>教育</option><option>科技</option><option>环境</option><option>健康</option><option>社会</option><option>历史</option><option>动植物</option><option>商业</option><option>文化</option><option>其他</option>
    </select>
    <label>时间</label>
    <select id="f-time">
      <option value="all">全部</option>
      <option value="7">近 7 天</option>
      <option value="30">近 1 个月</option>
      <option value="old">更久之前</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <div class="footer"><a href="我的阅读库.html">← 我的阅读库</a><br>由雅思精读教练生成 ｜ 双击本文件即可离线查看</div>
</div>

<script>
  // ═══ 生成说明（教练生成时按 精读文章.md 填写，生成完保留本注释亦可）═══
  // NOW 不用填——打开页面的当天自动算，时间筛选按打开当天倒推。
  // DATA：精读文章.md 每篇一个对象，按日期倒序排：
  //   t = 文章标题；cat = 话题（十类之一）；date = 存库日期（YYYY-MM-DD）；
  //   paras = 正文段落数组（英文原文，一段一个元素）；
  //   tr = 「中文意思参考」段落数组（与 paras 一一对应）——是诠释不是逐字机械翻译，
  //        专有名词、专业术语保留英文不译；学生卡住才自己展开看，别直接亮给他。
  const NOW = new Date();
  const DATA = [
    // { t: 'The Purpose of Homework', cat: '教育', date: '2026-11-06', paras: ['...'], tr: ['...'] },
  ];

  function daysAgo(d){ if (!d) return Infinity; return Math.floor((NOW - new Date(d + 'T00:00:00')) / 86400000); }
  function passFilter(item){
    const cat = document.getElementById('f-cat').value, t = document.getElementById('f-time').value;
    if (cat !== 'all' && item.cat !== cat) return false;
    if (t === 'old') return daysAgo(item.date) > 30;
    if (t !== 'all' && daysAgo(item.date) > +t) return false;
    return true;
  }
  function render(){
    const box = document.getElementById('list');
    box.innerHTML = '';
    const groups = {};
    DATA.forEach(item => {
      if (!passFilter(item)) return;
      (groups[item.cat] = groups[item.cat] || []).push(item);
    });
    let total = 0;
    Object.entries(groups).forEach(([cat, items]) => {
      const sec = document.createElement('div'); sec.className = 'sec';
      sec.textContent = '📚 ' + cat + ' ｜ ' + items.length + ' 篇';
      box.appendChild(sec);
      items.forEach(item => {
        const card = document.createElement('details'); card.className = 'card';
        card.innerHTML = '<summary class="title"><span>📄 ' + item.t + '</span><span class="date">' + item.date + '</span></summary><div class="body">' +
          item.paras.map(p => '<p>' + p + '</p>').join('') +
          '<details><summary>🌐 中文意思参考</summary><div class="tr">' +
          item.tr.map(p => '<p>' + p + '</p>').join('') + '</div></details></div>';
        box.appendChild(card);
      });
      total += items.length;
    });
    if (!total) {
      box.innerHTML = '<div class="empty">这个条件下没有存过的文章</div>';
    }
    document.getElementById('count').textContent = '显示 ' + total + ' 篇';
  }
  ['f-cat','f-time'].forEach(id => document.getElementById(id).addEventListener('change', render));
  render();
</script>
</body>
