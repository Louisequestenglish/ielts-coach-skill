<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf6ef; color: #333; margin: 0; padding: 24px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; color: #2F4B7C; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #999; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 20px; }
  .card-head { border-bottom: 2px solid #2F4B7C; padding-bottom: 10px; margin-bottom: 8px; }
  .card-head h2 { font-size: 17px; color: #2F4B7C; margin: 0; }
  .card-head .en { font-size: 12px; color: #999; margin-top: 3px; }
  .toolbar { background: #fff; border-radius: 12px; padding: 10px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar label { font-size: 12px; color: #999; }
  .toolbar select { border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; font-size: 13px; color: #2F4B7C; background: #fff; outline: none; }
  .toolbar .count { margin-left: auto; font-size: 12px; color: #999; }
  details.q { border-bottom: 1px dashed #eee; padding: 6px 0; }
  details.q:last-of-type { border-bottom: none; }
  details.q summary { cursor: pointer; font-size: 14px; color: #222; font-weight: 600; }
  details.q summary .date { font-size: 12px; color: #999; font-weight: 400; margin-left: 6px; }
  details.q .qbody { font-size: 14px; color: #444; line-height: 1.8; margin: 8px 0 4px 14px; }
  .qbody .err { color: #666; }
  .qbody .ok { color: #222; font-weight: 600; }
  .emptyrow { text-align: center; color: #bbb; font-size: 13px; padding: 20px 0; }
  .chip { display: inline-block; background: #D84830; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
  .done { display: inline-block; background: #3a9d6e; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
  .footer { text-align: center; font-size: 12px; color: #bbb; margin-top: 30px; line-height: 2; }
  .footer a { color: #2F4B7C; text-decoration: none; font-weight: 600; }
  .footer a:hover { color: #D84830; }
  .brand { position: relative; background: #fff; border-radius: 12px; padding: 20px 22px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 20px; border-bottom: 4px solid #2F4B7C; overflow: hidden; }
  .brand .logo { position: absolute; top: 14px; right: 16px; height: 30px; }
  .brand h1 { font-size: 22px; color: #2F4B7C; margin: 0 0 4px; }
  .brand .sub { font-size: 13px; color: #999; margin: 0; }
  .brand .dot { position: absolute; bottom: 13px; right: 46px; width: 12px; height: 12px; border-radius: 50%; background: #D84830; }
  .brand .sq { position: absolute; bottom: 13px; right: 22px; width: 14px; height: 14px; background: #2F4B7C; transform: rotate(45deg); }
</style>

    <div class="sub">旷野英语 · 雅思核心课 ｜ 雅思精读教练</div>

  <div class="toolbar">
    <label>时间</label>
    <select id="f-time">
      <option value="all">全部</option>
      <option value="7">近 7 天</option>
      <option value="30">近 1 个月</option>
      <option value="old">更久之前</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div class="card">
    <div class="card-head"><h2>拆不明白的长难句</h2><div class="en">点开原句看：上次怎么认错的 + 正确拆法</div></div>
    <div id="list"></div>
  </div>

  <div class="footer"><a href="我的阅读库.html">← 我的阅读库</a><br>由雅思精读教练生成 ｜ 双击本文件即可离线查看</div>

<script>
  // ═══ 生成说明（教练生成时按 精读档案.md 填写，生成完保留本注释亦可）═══
  // NOW 不用填——打开页面的当天自动算，时间筛选按打开当天倒推。
  // DATA：精读档案.md 每条一个对象，按日期倒序排：
  //   s = 原句；e = 上次认错成什么；o = 正确拆法；
  //   d = 记录日期（YYYY-MM-DD；同一句重复认错，日期更新为最近一次认错的日期）；
  //   n = 认错次数（第 1 次记 1，重复累加 +1，页面标「第 N 次」chip）。
  //   旧档案没有日期的条目：d 留空 ''，筛选时归「更久之前」。
  const NOW = new Date();
  const DATA = [
    // { s: '原句', e: '上次认错成', o: '正确拆法', d: '2026-11-06', n: 1 },
  ];

  function daysAgo(d){ if (!d) return Infinity; return Math.floor((NOW - new Date(d + 'T00:00:00')) / 86400000); }
  function passFilter(item){
    const t = document.getElementById('f-time').value;
    if (t === 'all') return true;
    if (t === 'old') return daysAgo(item.d) > 30;
    return daysAgo(item.d) <= +t;
  }
  function render(){
    const box = document.getElementById('list');
    box.innerHTML = '';
    if (!DATA.length) {
      box.innerHTML = '<div class="emptyrow">还没有记录——拆不明白的长难句，批完会自动记在这里。</div>';
      document.getElementById('count').textContent = '';
      return;
    }
    let total = 0;
    DATA.forEach(item => {
      if (!passFilter(item)) return;
      const date = item.d ? ' <span class="date">' + item.d + '</span>' : '';
      const chip = item.n > 1 ? ' <span class="chip">第 ' + item.n + ' 次</span>' : '';
      const d = document.createElement('details'); d.className = 'q';
      d.innerHTML = '<summary>' + item.s + date + chip + '</summary><div class="qbody"><span class="err">❌ 上次认错成：' + item.e + '</span><br><span class="ok">✅ 正确拆法：' + item.o + '</span></div>';
      box.appendChild(d);
      total++;
    });
    if (!total) box.innerHTML = '<div class="emptyrow">这个时间范围里没有长难句</div>';
    document.getElementById('count').textContent = total ? '显示 ' + total + ' 条' : '';
  }
  document.getElementById('f-time').addEventListener('change', render);
  render();
</script>
