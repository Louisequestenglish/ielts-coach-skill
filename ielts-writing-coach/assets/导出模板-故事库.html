<meta charset="UTF-8">

<title>我的故事库</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf6ef; color: #333; margin: 0; padding: 24px 16px 60px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .brand { position: relative; background: #fff; border-radius: 12px; padding: 20px 22px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 20px; border-bottom: 4px solid #2F4B7C; overflow: hidden; }
  .brand .logo { position: absolute; top: 14px; right: 16px; height: 30px; }
  .brand h1 { font-size: 22px; color: #2F4B7C; margin: 0 0 4px; }
  .brand .sub { font-size: 13px; color: #999; margin: 0; }
  .brand .dot { position: absolute; bottom: 13px; right: 46px; width: 12px; height: 12px; border-radius: 50%; background: #D84830; }
  .brand .sq { position: absolute; bottom: 13px; right: 22px; width: 14px; height: 14px; background: #2F4B7C; transform: rotate(45deg); }
  .sec { background: #2F4B7C; color: #fff; border-radius: 10px; padding: 10px 16px; margin: 28px 0 14px; font-size: 15px; font-weight: 600; }
  .card { background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 20px; }
  .beat { padding: 14px 0; border-bottom: 1px dashed #eee; }
  .beat:last-child { border-bottom: none; }
  .beat h3 { font-size: 13px; color: #D84830; margin: 0 0 8px; }
  .en { font-size: 15px; line-height: 1.8; color: #222; margin: 0 0 6px; }
  .en b { color: #D84830; }
  .zh { font-size: 13px; color: #666; margin: 0 0 6px; }
  .kw { font-size: 12px; color: #2F4B7C; margin: 0 0 4px; }
  .hi { font-size: 12px; color: #999; margin: 0 0 8px; }
  audio { width: 100%; margin: 6px 0 0; }
  .chip { display: inline-block; background: #D84830; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; vertical-align: 1px; }
  .chip.b { background: #2F4B7C; }
  .chip.tag { background: #fff; color: #2F4B7C; border: 1px solid #2F4B7C; }
  .expr { padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
  .expr:last-child { border-bottom: none; }
  .expr b { color: #2F4B7C; }
  .toolbar { background: #fff; border-radius: 12px; padding: 12px 18px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #555; }
  .toolbar select { font: inherit; color: #2F4B7C; border: 1px solid #2F4B7C; border-radius: 8px; padding: 5px 10px; background: #fff; cursor: pointer; }
  .toolbar .cnt { margin-left: auto; font-size: 12px; color: #999; }
  .sec.search { display: flex; align-items: center; justify-content: space-between; }
  .sec.search input { font: inherit; font-weight: normal; font-size: 13px; width: 150px; border: none; border-radius: 8px; padding: 5px 10px; color: #333; outline: none; }
  .xhead { font-size: 15px; font-weight: 600; color: #D84830; margin: 0 0 6px; }
  .xrow { padding: 9px 0; border-bottom: 1px dashed #eee; }
  .xrow:last-child { border-bottom: none; }
  .xrow .kw { margin-bottom: 2px; }
  .xrow .hi { margin-bottom: 0; }
  .empty { background: #fff; border-radius: 12px; padding: 18px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 20px; font-size: 13px; color: #999; }
  .footer { text-align: center; font-size: 12px; color: #bbb; margin-top: 30px; line-height: 1.8; }
</style>
</head>

    <h1>我的故事库</h1>
    <div class="sub">旷野英语 · 雅思核心课 ｜ 我的生活故事</div>
    <div class="dot"></div><div class="sq"></div>
  </div>

  <!-- 生成规则（教练照填，示例数据替换成真实档案；没有的区段把数组清空，对应小节自动不显示）：
       读「生活故事」子文件夹的故事库目录.txt 拿故事清单（顺序照目录），每个故事读它的故事卡.md：
       STORIES 每个故事 = { name:故事名, tag:话题标签（故事卡标题下一行的「> 话题：X」里的 X；旧故事没标签 → 留空，自动归「未分类」）,
         beats:[ { en:英文正文（好表达加粗 <b>）, zh:中文对照, kw:内容关键词, hi:亮点表达, audio:该 beat 的 mp3 base64（音频文件夹里有就内嵌，没有 → 留空）}, … ],
         full:全.mp3 的 base64（有整篇连读就填，没有 → 留空） }
       XUANTI 读 串题档案.md：新格式每个「故事串」节一张卡 { head:'故事串N · 故事名', rows:[ { d:日期, q:所串题目, s:'取哪些段 + 开头要点' }, … ] }；
       旧格式（日期｜所串题目）照旧出卡（接旧不搬）：{ head:'日期', rows:[ { q:所串题目, s:'复用故事：X' } ] }。
       EXPR 读 精华表达.md：一行一条 { e:表达, z:中文意思, from:来自哪个故事, n:重复次数（重复出现标「又用了 N 次」，n>1 才出 chip） }。
       注意：英文正文常带撇号（couldn't），会打断单引号字符串——含撇号的字段改用双引号包住。 -->
  <script>
    const STORIES = [
      { name: '哈尔滨之行', tag: '旅行', beats: [
        { en: '（英文正文，好表达加粗）', zh: '（中文对照）', kw: '（内容关键词）', hi: '（亮点表达）', audio: '' }
      ], full: '' }
    ];
    const XUANTI = [
      { head: '故事串一 · 哈尔滨之行', rows: [
        { d: '2026-11-03', q: 'Describe a journey you remember well', s: '取 Beat 1+2，开头说时间地点' }
      ] }
    ];
    const EXPR = [
      { e: '（表达）', z: '（中文意思）', from: '哈尔滨之行', n: 1 }
    ];
  </script>

  <div class="toolbar"><label for="f-topic">选择话题</label><select id="f-topic"></select><span class="cnt" id="story-cnt"></span></div>
  <div id="stories"></div>

  <div class="sec search">🧵 串题档案<input id="f-search" placeholder="搜 P2 题…"></div>
  <div id="xuantis"></div>
  <div class="empty" id="x-empty" style="display:none">没有匹配的题</div>

  <div id="exprs"></div>

  <div class="footer">语料生成法借鉴自李笑来《人人都能用英语》「说自己想说的话」（github.com/xiaolai/everyone-can-use-english）；串题方法见旷野英语雅思核心课 P2 模块。<br>由雅思教练生成 ｜ 双击本文件即可离线查看</div>
</div>

<script>
  // —— 故事区：选择话题下拉 + 按标签分组 ——
  const storyBox = document.getElementById('stories');
  const sel = document.getElementById('f-topic');
  const cnt = document.getElementById('story-cnt');
  function audioStatus(s) {
    const n = s.beats.filter(b => b.audio).length;
    if (!n) return '暂无音频';
    return s.full ? n + ' 段 + 整篇' : n + ' 段音频';
  }
  function renderStories(tag) {
    const shown = tag === 'uncat' ? STORIES.filter(s => !s.tag) : (tag === 'all' ? STORIES : STORIES.filter(s => s.tag === tag));
    cnt.textContent = '共 ' + shown.length + ' 个故事';
    storyBox.innerHTML = shown.map(s => {
      let beatsHtml = s.beats.map((b, i) =>
        '<div class="beat"><h3>Beat ' + (i + 1) + '</h3>' +
        '<p class="en">' + b.en + '</p><p class="zh">' + b.zh + '</p>' +
        '<p class="kw">🔑 内容关键词：' + b.kw + '</p><p class="hi">✨ 亮点表达：' + b.hi + '</p>' +
        (b.audio ? '<audio controls src="' + b.audio + '"></audio>' : '') + '</div>'
      ).join('');
      if (s.full) beatsHtml += '<div class="beat"><h3>整篇连读</h3><audio controls src="' + s.full + '"></audio></div>';
      return '<div class="sec">🎤 ' + s.name +
        (s.tag ? '<span class="chip tag">' + s.tag + '</span>' : '') +
        '<span class="chip">' + s.beats.length + ' 个 beat</span><span class="chip b">' + audioStatus(s) + '</span></div>' +
        '<div class="card">' + beatsHtml + '</div>';
    }).join('');
    if (!shown.length) storyBox.innerHTML = '<div class="empty">这个分类里还没有故事</div>';
  }
  if (STORIES.length) {
    const topics = [...new Set(STORIES.map(s => s.tag).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
    const hasUncat = STORIES.some(s => !s.tag);
    let opts = '<option value="all">全部话题</option>' + topics.map(t => '<option value="' + t + '">' + t + '</option>').join('');
    if (hasUncat) opts += '<option value="uncat">未分类</option>';
    sel.innerHTML = opts;
    sel.onchange = () => renderStories(sel.value);
    renderStories('all');
  } else {
    document.querySelector('.toolbar').style.display = 'none';
    storyBox.innerHTML = '<div class="empty">还没有故事——想讲你的故事，说「我的故事」就行。</div>';
  }

  // —— 串题区：故事串卡 + 搜 P2 题 ——
  const xBox = document.getElementById('xuantis');
  const xEmpty = document.getElementById('x-empty');
  function renderXuantis() {
    xBox.innerHTML = XUANTI.map(c =>
      '<div class="card"><div class="xhead">' + c.head + '</div>' +
      c.rows.map(r =>
        '<div class="xrow"><p class="kw">' + (r.d ? r.d + '｜' : '') + r.q + '</p>' +
        '<p class="hi">' + (r.d ? '→ ' : '') + r.s + '</p></div>'
      ).join('') + '</div>'
    ).join('');
  }
  if (XUANTI.length) {
    renderXuantis();
    const input = document.getElementById('f-search');
    input.oninput = () => {
      const q = input.value.trim().toLowerCase();
      const cards = xBox.querySelectorAll('.card');
      let any = false;
      cards.forEach(card => {
        let shown = 0;
        card.querySelectorAll('.xrow').forEach(row => {
          const hit = !q || row.querySelector('.kw').textContent.toLowerCase().includes(q);
          row.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        card.style.display = shown ? '' : 'none';
        if (shown) any = true;
      });
      xEmpty.style.display = any ? 'none' : '';
    };
  } else {
    document.querySelector('.sec.search').style.display = 'none';
  }

  // —— 精华表达 ——
  if (EXPR.length) {
    document.getElementById('exprs').innerHTML =
      '<div class="sec">⭐ 精华表达</div><div class="card">' +
      EXPR.map(e => '<div class="expr"><b>' + e.e + '</b> —— ' + e.z +
        '<span class="chip">' + e.from + '</span>' +
        (e.n > 1 ? '<span class="chip b">又用了 ' + e.n + ' 次</span>' : '') +
        '</div>').join('') + '</div>';
  }
</script>
</body>
